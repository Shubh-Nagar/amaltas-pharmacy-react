<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amaltas Institute of Pharmacy · Dewas</title>
    <meta name="description" content="Amaltas Institute of Pharmacy, Dewas. PCI approved B.Pharm and D.Pharm courses, a constituent unit of Amaltas University." />
    <meta name="theme-color" content="#143F24" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // apply saved theme before React mounts (avoids a flash)
      try { var t = localStorage.getItem('aip-theme') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'); document.documentElement.setAttribute('data-theme', t); } catch (e) {}
      document.documentElement.classList.add('is-loading');
    </script>
    <style>
      /* "Amaltas Pharmacy" page loader. Inline so it paints before the JS bundle loads;
         React's <PageLoader> renders the same markup and takes over seamlessly. */
      html.is-loading,html.is-loading body{overflow:hidden}
      .pldr{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(720px 520px at 50% 42%,#1F5C36 0%,#123A22 45%,#0A2114 100%);color:#fff;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s}
      .pldr.on{opacity:1;visibility:visible;transition:opacity .35s ease}
      .pldr::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 80%,rgba(243,201,91,.08),transparent 40%),radial-gradient(circle at 85% 15%,rgba(243,201,91,.07),transparent 35%);pointer-events:none}
      .pl-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;transform:scale(1.04);opacity:.6;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s}
      .pldr.on .pl-in{transform:none;opacity:1}
      .pl-mark{position:relative;width:124px;height:124px;display:grid;place-items:center}
      .pl-ring{position:absolute;inset:0;width:100%;height:100%;animation:plspin 1.3s linear infinite}
      .pl-ring circle{fill:none;stroke:rgba(255,255,255,.1);stroke-width:3.5}
      .pl-ring .pl-arc{stroke:#F3C95B;stroke-linecap:round;stroke-dasharray:80 260}
      .pl-cap{position:relative;width:78px;height:30px;display:flex;transform:rotate(-35deg);animation:plwob 1.6s ease-in-out infinite;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
      .pl-h{flex:1;height:100%}
      .pl-h.a{background:linear-gradient(180deg,#FBE07F,#E0A82E);border-radius:15px 0 0 15px;animation:plA 1.6s ease-in-out infinite}
      .pl-h.b{background:linear-gradient(180deg,#FFFFFF,#D3E3D8);border-radius:0 15px 15px 0;animation:plB 1.6s ease-in-out infinite}
      .pl-dot{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#F3C95B;opacity:0;animation:pldot 1.6s ease-out infinite}
      .pl-dot.d2{width:4px;height:4px;margin:-2px;background:#fff;animation-delay:.08s}
      .pl-dot.d3{width:5px;height:5px;margin:-2.5px;animation-delay:.16s}
      .pl-txt{text-align:center;line-height:1}
      .pl-txt b{display:block;font:600 38px/1 "Fraunces",Georgia,serif;letter-spacing:.5px;background:linear-gradient(90deg,#fff 0%,#fff 40%,#F3C95B 50%,#fff 60%,#fff 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:plshine 2s linear infinite}
      .pl-txt span{display:block;margin-top:10px;font:700 11.5px "Plus Jakarta Sans",system-ui,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:#F3C95B}
      .pl-bar{width:170px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
      .pl-bar i{display:block;width:40%;height:100%;border-radius:3px;background:linear-gradient(90deg,#F3C95B,#E0A82E);animation:plbar 1.1s ease-in-out infinite}
      @keyframes plspin{to{transform:rotate(360deg)}}
      @keyframes plwob{0%,100%{transform:rotate(-35deg)}50%{transform:rotate(-35deg) scale(1.06)}}
      @keyframes plA{0%,25%,80%,100%{transform:none}45%,60%{transform:translateX(-8px)}}
      @keyframes plB{0%,25%,80%,100%{transform:none}45%,60%{transform:translateX(8px)}}
      @keyframes pldot{0%,35%{opacity:0;transform:none}50%{opacity:1}80%,100%{opacity:0;transform:translate(var(--x,14px),var(--y,-26px))}}
      .pl-dot.d1{--x:-16px;--y:-24px}.pl-dot.d2{--x:18px;--y:-20px}.pl-dot.d3{--x:4px;--y:28px}
      @keyframes plshine{from{background-position:100% 0}to{background-position:-150% 0}}
      @keyframes plbar{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
      @media (prefers-reduced-motion:reduce){.pl-ring,.pl-cap,.pl-h,.pl-dot,.pl-txt b,.pl-bar i{animation:none}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="pldr on" role="status" aria-label="Loading page">
        <div class="pl-in">
          <div class="pl-mark" aria-hidden="true">
            <svg class="pl-ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" /><circle class="pl-arc" cx="60" cy="60" r="54" /></svg>
            <div class="pl-cap"><span class="pl-h a"></span><span class="pl-h b"></span></div>
            <i class="pl-dot d1"></i><i class="pl-dot d2"></i><i class="pl-dot d3"></i>
          </div>
          <div class="pl-txt"><b>Amaltas</b><span>Institute of Pharmacy</span></div>
          <div class="pl-bar"><i></i></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
